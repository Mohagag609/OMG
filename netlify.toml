[build]
  command = "npm run build:cloud"
  publish = "out"

[build.environment]
  NODE_VERSION = "18"
  DATABASE_URL = "postgresql://neondb_owner:npg_x5qvmpzF3hjX@ep-dawn-cell-adylfb98-pooler.c-2.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require"
  NEON_DATABASE_URL = "postgresql://neondb_owner:npg_x5qvmpzF3hjX@ep-dawn-cell-adylfb98-pooler.c-2.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require"
  NEXTAUTH_SECRET = "estate-management-super-secret-key-2024-production"
  NEXTAUTH_URL = "https://your-app-name.netlify.app"
  NODE_ENV = "production"
  JWT_SECRET = "estate-management-super-secret-key-2024-production"
  TZ = "Africa/Cairo"

# إعدادات Netlify Functions للـ API routes
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# إعادة توجيه API routes إلى Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# إعادة توجيه جميع الصفحات الأخرى
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

[functions]
  node_bundler = "esbuild"